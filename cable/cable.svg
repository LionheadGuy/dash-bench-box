<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 700" width="1180" height="700" font-family="Segoe UI, Arial, sans-serif">
<rect width="1180" height="700" fill="#ffffff"/>
<text x="24" y="40" font-size="27" font-weight="bold">Dash bench box - CAN breakout cable (DESIGN 2026-11-13, ferrule ends 2026-11-14)</text>
<text x="24" y="68" font-size="15" fill="#555">One DTM 12-way plug on the rear I/O board’s header → four legs ending in ferrules, one into each laptop USB-CAN adapter’s screw terminal. Not to scale.</text>
<rect x="40" y="150" width="150" height="330" rx="8" fill="#eef2f7" stroke="#1f3a5f" stroke-width="2.5" stroke-dasharray="9 6"/>
<text x="115" y="176" font-size="15" font-weight="bold" text-anchor="middle">dash bench box</text>
<text x="115" y="196" font-size="12" text-anchor="middle" fill="#555">back wall</text>
<text x="115" y="440" font-size="12" text-anchor="middle" fill="#555">rear I/O board</text>
<text x="115" y="458" font-size="12" text-anchor="middle" fill="#555">120 R on DIP 1-4</text>
<text x="40" y="506" font-size="12" fill="#333">board header: TE DTM13-12PA-R005, right angle,</text>
<text x="40" y="522" font-size="12" fill="#333">face about flush with the outside of the wall</text>
<rect x="196" y="190" width="34" height="250" rx="4" fill="#3a3a3a" stroke="#000"/>
<rect x="230" y="184" width="78" height="262" rx="8" fill="#b9bec4" stroke="#4a4a4a" stroke-width="2"/>
<text x="269" y="160" font-size="14" font-weight="bold" text-anchor="middle">DTM06-12SA</text>
<text x="269" y="176" font-size="11" text-anchor="middle" fill="#555">+ WM-12S wedge</text>
<text x="269" y="462" font-size="11" text-anchor="middle" fill="#555">12 x 0462-201-20141</text>
<text x="269" y="478" font-size="11" text-anchor="middle" fill="#555">size 20 socket, 20 AWG</text>
<path d="M 308 218 H 428 C 508 218, 418 150, 538 150" fill="none" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
<line x1="578" y1="150" x2="1010" y2="150" stroke="#c0392b" stroke-width="9" stroke-linecap="round"/>
<text x="302" y="209" font-size="11" text-anchor="end" fill="#222">cav 1,2,3</text>
<rect x="338" y="205" width="74" height="26" rx="4" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="375" y="224" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">ENGINE</text>
<rect x="924" y="137" width="74" height="26" rx="4" fill="#fff" stroke="#c0392b" stroke-width="2"/>
<text x="961" y="156" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">ENGINE</text>
<text x="558" y="116" font-size="12" fill="#222">CAN_H YE/BK → H &#160;&#160; CAN_L GN/BK → L &#160;&#160; CAN_GND BK → GND &#160;&#160; (0.5 mm² ferrules)</text>
<text x="558" y="196" font-size="12" fill="#666">H and L twisted, ground alongside; own sleeve; this bus’s ground goes nowhere else</text>
<rect x="1014" y="134" width="26" height="8" rx="2" fill="#f2f2f2" stroke="#444" stroke-width="1.5"/>
<rect x="1014" y="146" width="26" height="8" rx="2" fill="#f2f2f2" stroke="#444" stroke-width="1.5"/>
